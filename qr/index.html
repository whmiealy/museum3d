<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三维资源库 · 二维码</title>
<style>
body{margin:0;padding:16px;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#111;background:#fff}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:20px;margin:0}
button{font:inherit;padding:8px 16px;border:1px solid #111;background:#fff;border-radius:6px;cursor:pointer}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
figure{margin:0;padding:10px;border:1px dashed #999;text-align:center;break-inside:avoid}
img{width:100%;max-width:170px;display:block;margin:0 auto}
figcaption{margin-top:6px;font-size:13px;line-height:1.4}
figcaption b,figcaption span{display:block;overflow-wrap:anywhere}
@media print{header{display:none}body{padding:0}main{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><h1>三维资源库 · 二维码（共 4 个）</h1><button onclick="print()">打印</button></header>
<main>
<figure><img src="HPS-12.png" alt="HPS-12"><figcaption><b>HPS-12</b><span>黑袍猪神</span></figcaption></figure>
<figure><img src="HQS-02.png" alt="HQS-02"><figcaption><b>HQS-02</b><span>红裙牛神</span></figcaption></figure>
<figure><img src="HQS-03.png" alt="HQS-03"><figcaption><b>HQS-03</b><span>红裙虎神</span></figcaption></figure>
<figure><img src="hall-niwan-hall.png" alt="niwan-hall"><figcaption><b>niwan-hall</b><span>泥玩世家 3D 展厅</span></figcaption></figure>
</main></body></html>
